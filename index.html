<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Pengumpulan Tugas Siswa</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SweetAlert2 for notifications -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    .custom-dashed-border {
      background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='12' ry='12' stroke='%236366F1FF' stroke-width='2' stroke-dasharray='6%2c 8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
      border-radius: 12px;
    }
    .drag-active {
      background-color: #eef2ff !important;
      border-color: #4f46e5 !important;
    }
  </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6 md:p-8">

  <div class="w-full max-w-2xl glass-card rounded-2xl p-6 sm:p-8 border border-indigo-100">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 text-white rounded-2xl shadow-lg mb-4">
        <i class="fa-solid fa-cloud-arrow-up text-2xl"></i>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">Pengumpulan Tugas Siswa</h1>
      <p class="text-sm sm:text-base text-slate-500 mt-1">Isi formulir di bawah ini untuk mengunggah tugas sekolah Anda.</p>
    </div>

    <!-- Alert / Notification Banner -->
    <div id="statusBanner" class="hidden mb-6 p-4 rounded-xl text-sm font-medium flex items-center gap-3"></div>

    <form id="tugasForm" class="space-y-5">
      
      <!-- Nama Siswa -->
      <div>
        <label for="nama" class="block text-sm font-semibold text-slate-700 mb-1">
          <i class="fa-solid fa-user text-indigo-500 mr-1.5"></i>Nama Lengkap Siswa
        </label>
        <input type="text" id="nama" placeholder="Contoh: Ahmad Rizky" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none text-slate-800 text-sm">
      </div>

      <!-- Grid 2 Kolom: Kelas & Nama Kelas -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Kelas Dropdown -->
        <div>
          <label for="kelas" class="block text-sm font-semibold text-slate-700 mb-1">
            <i class="fa-solid fa-graduation-cap text-indigo-500 mr-1.5"></i>Tingkat Kelas
          </label>
          <div class="relative">
            <select id="kelas" disabled
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none text-slate-800 text-sm bg-slate-50 disabled:bg-slate-100 appearance-none">
              <option value="" disabled selected>Memuat data kelas...</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
          </div>
        </div>

        <!-- Nama Kelas Dropdown -->
        <div>
          <label for="namaKelas" class="block text-sm font-semibold text-slate-700 mb-1">
            <i class="fa-solid fa-school text-indigo-500 mr-1.5"></i>Nama Kelas / Rombel
          </label>
          <div class="relative">
            <select id="namaKelas" disabled
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none text-slate-800 text-sm bg-slate-50 disabled:bg-slate-100 appearance-none">
              <option value="" disabled selected>Pilih Tingkat Kelas dulu</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
          </div>
        </div>
      </div>

      <!-- Mata Pelajaran -->
      <div>
        <label for="mapel" class="block text-sm font-semibold text-slate-700 mb-1">
          <i class="fa-solid fa-book text-indigo-500 mr-1.5"></i>Mata Pelajaran
        </label>
        <div class="relative">
          <select id="mapel" disabled
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none text-slate-800 text-sm bg-slate-50 disabled:bg-slate-100 appearance-none">
            <option value="" disabled selected>Memuat data mapel...</option>
          </select>
          <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
        </div>
      </div>

      <!-- Bab / Materi -->
      <div>
        <label for="materi" class="block text-sm font-semibold text-slate-700 mb-1">
          <i class="fa-solid fa-bookmark text-indigo-500 mr-1.5"></i>Bab / Materi Pembelajaran
        </label>
        <input type="text" id="materi" placeholder="Contoh: Bab 1 - Persamaan Kuadrat" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none text-slate-800 text-sm">
      </div>

      <!-- Jenis Tugas -->
      <div>
        <label for="tugas" class="block text-sm font-semibold text-slate-700 mb-1">
          <i class="fa-solid fa-list-check text-indigo-500 mr-1.5"></i>Jenis Tugas
        </label>
        <div class="relative">
          <select id="tugas" disabled
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none text-slate-800 text-sm bg-slate-50 disabled:bg-slate-100 appearance-none">
            <option value="" disabled selected>Memuat jenis tugas...</option>
          </select>
          <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
        </div>
      </div>

      <!-- Dropzone File Upload -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">
          <i class="fa-solid fa-paperclip text-indigo-500 mr-1.5"></i>Upload File Tugas (Maksimal 20MB)
        </label>
        
        <div id="dropzone" class="custom-dashed-border p-6 text-center cursor-pointer transition bg-indigo-50/50 hover:bg-indigo-50 relative">
          <input type="file" id="file" class="hidden" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar">
          
          <div id="dropzoneContent">
            <i class="fa-solid fa-file-arrow-up text-3xl text-indigo-500 mb-2"></i>
            <p class="text-sm font-semibold text-slate-700">Klik untuk memilih file atau seret file ke sini</p>
            <p class="text-xs text-slate-400 mt-1">Format diizinkan: PDF, Images, Word, Excel, PowerPoint, ZIP, RAR</p>
          </div>

          <div id="fileInfo" class="hidden items-center justify-between bg-white p-3 rounded-xl border border-indigo-100 shadow-sm">
            <div class="flex items-center space-x-3 overflow-hidden">
              <i id="fileIcon" class="fa-solid fa-file text-2xl text-indigo-600 flex-shrink-0"></i>
              <div class="text-left truncate">
                <p id="fileName" class="text-sm font-semibold text-slate-800 truncate"></p>
                <p id="fileSize" class="text-xs text-slate-400"></p>
              </div>
            </div>
            <button type="button" id="removeFileBtn" class="text-slate-400 hover:text-red-500 p-2 transition">
              <i class="fa-solid fa-xmark text-base"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" disabled
        class="w-full py-3.5 px-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-200 transition duration-200 flex items-center justify-center space-x-2 disabled:bg-slate-300 disabled:shadow-none disabled:cursor-not-allowed">
        <i class="fa-solid fa-paper-plane"></i>
        <span id="submitBtnText">Kirim Tugas</span>
      </button>

    </form>
  </div>

  <script>
    // State aplikasi
    let globalDropdownData = { namaKelasMap: {}, mapel: [], tugas: [] };
    let isDataLoaded = false;
    let selectedFile = null;

    // DOM Elements
    const form = document.getElementById("tugasForm");
    const kelasSelect = document.getElementById("kelas");
    const namaKelasSelect = document.getElementById("namaKelas");
    const mapelSelect = document.getElementById("mapel");
    const tugasSelect = document.getElementById("tugas");
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("file");
    const dropzoneContent = document.getElementById("dropzoneContent");
    const fileInfo = document.getElementById("fileInfo");
    const fileNameEl = document.getElementById("fileName");
    const fileSizeEl = document.getElementById("fileSize");
    const removeFileBtn = document.getElementById("removeFileBtn");
    const submitBtn = document.getElementById("submitBtn");
    const submitBtnText = document.getElementById("submitBtnText");

    window.addEventListener("DOMContentLoaded", () => {
      loadDropdowns();
      setupDropzone();
    });

    function loadDropdowns() {
      if (typeof google === "undefined" || !google.script || !google.script.run) {
        showStaticMessage("Aplikasi harus dijalankan di lingkungan Google Apps Script Web App.", "error");
        return;
      }

      google.script.run
        .withSuccessHandler(onDropdownSuccess)
        .withFailureHandler(onDropdownError)
        .getDropdownData();
    }

    function onDropdownSuccess(data) {
      globalDropdownData = data || { namaKelasMap: {}, mapel: [], tugas: [] };
      isDataLoaded = true;

      // Populate Kelas
      const kelasList = Object.keys(globalDropdownData.namaKelasMap || {});
      populateSelect(kelasSelect, kelasList, "Pilih Tingkat Kelas");
      kelasSelect.disabled = false;
      kelasSelect.classList.remove("bg-slate-50");

      // Populate Mapel
      populateSelect(mapelSelect, globalDropdownData.mapel || [], "Pilih Mata Pelajaran");
      mapelSelect.disabled = false;
      mapelSelect.classList.remove("bg-slate-50");

      // Populate Jenis Tugas
      populateSelect(tugasSelect, globalDropdownData.tugas || [], "Pilih Jenis Tugas");
      tugasSelect.disabled = false;
      tugasSelect.classList.remove("bg-slate-50");

      submitBtn.disabled = false;
    }

    function onDropdownError(err) {
      Swal.fire({
        icon: "error",
        title: "Gagal Memuat Data",
        text: err.message || "Terjadi kesalahan saat mengambil data dari Spreadsheet.",
        confirmButtonColor: "#4f46e5"
      });
    }

    // Dynamic Cascade Dropdown Kelas -> Nama Kelas
    kelasSelect.addEventListener("change", function () {
      const selectedKelas = this.value;
      const subKelasList = globalDropdownData.namaKelasMap[selectedKelas] || [];

      if (subKelasList.length > 0) {
        populateSelect(namaKelasSelect, subKelasList, "Pilih Nama Kelas");
        namaKelasSelect.disabled = false;
        namaKelasSelect.classList.remove("bg-slate-50");
      } else {
        populateSelect(namaKelasSelect, [], "Tidak ada kelas tersedia");
        namaKelasSelect.disabled = true;
      }
    });

    function populateSelect(selectElement, items, defaultText) {
      selectElement.innerHTML = `<option value="" disabled selected>${defaultText}</option>`;
      items.forEach(item => {
        const opt = document.createElement("option");
        opt.value = item;
        opt.textContent = item;
        selectElement.appendChild(opt);
      });
    }

    function setupDropzone() {
      dropzone.addEventListener("click", (e) => {
        if (e.target !== removeFileBtn && !removeFileBtn.contains(e.target)) {
          fileInput.click();
        }
      });

      ["dragenter", "dragover"].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropzone.classList.add("drag-active");
        }, false);
      });

      ["dragleave", "drop"].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropzone.classList.remove("drag-active");
        }, false);
      });

      dropzone.addEventListener("drop", (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length) handleFileSelect(files[0]);
      });

      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length) handleFileSelect(e.target.files[0]);
      });

      removeFileBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        resetFileSelection();
      });
    }

    function handleFileSelect(file) {
      const maxSize = 20 * 1024 * 1024; // 20MB
      if (file.size > maxSize) {
        Swal.fire("Ukuran Terlalu Besar", "Ukuran file maksimal adalah 20MB.", "warning");
        return;
      }

      selectedFile = file;
      fileNameEl.textContent = file.name;
      fileSizeEl.textContent = formatBytes(file.size);

      dropzoneContent.classList.add("hidden");
      fileInfo.classList.remove("hidden");
      fileInfo.classList.add("flex");
    }

    function resetFileSelection() {
      selectedFile = null;
      fileInput.value = "";
      dropzoneContent.classList.remove("hidden");
      fileInfo.classList.add("hidden");
      fileInfo.classList.remove("flex");
    }

    function formatBytes(bytes) {
      if (bytes === 0) return "0 Bytes";
      const k = 1024;
      const sizes = ["Bytes", "KB", "MB", "GB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const formData = {
        nama: document.getElementById("nama").value.trim(),
        kelas: kelasSelect.value,
        namaKelas: namaKelasSelect.value,
        mapel: mapelSelect.value,
        materi: document.getElementById("materi").value.trim(),
        tugas: tugasSelect.value
      };

      // Validasi Form
      if (!formData.nama) return showWarning("Nama Siswa belum diisi!");
      if (!formData.kelas) return showWarning("Tingkat Kelas belum dipilih!");
      if (!formData.namaKelas) return showWarning("Nama Kelas belum dipilih!");
      if (!formData.mapel) return showWarning("Mata Pelajaran belum dipilih!");
      if (!formData.materi) return showWarning("Bab / Materi belum diisi!");
      if (!formData.tugas) return showWarning("Jenis Tugas belum dipilih!");
      if (!selectedFile) return showWarning("File Tugas belum diunggah!");

      setLoading(true);

      const reader = new FileReader();
      reader.onload = function (event) {
        const rawData = event.target.result.split(",")[1];
        
        const payload = {
          ...formData,
          file: {
            name: selectedFile.name,
            type: selectedFile.type || "application/octet-stream",
            data: rawData
          }
        };

        google.script.run
          .withSuccessHandler(onUploadSuccess)
          .withFailureHandler(onUploadError)
          .uploadFile(payload);
      };

      reader.onerror = function () {
        setLoading(false);
        Swal.fire("Gagal", "Gagal membaca berkas file.", "error");
      };

      reader.readAsDataURL(selectedFile);
    });

    function onUploadSuccess(res) {
      setLoading(false);
      if (res.status === "success") {
        Swal.fire({
          icon: "success",
          title: "Berhasil Terkirim!",
          text: res.replaced 
            ? "Tugas sebelumnya dengan kategori yang sama berhasil diperbarui." 
            : "Tugas Anda telah berhasil dikirim ke guru.",
          confirmButtonColor: "#4f46e5"
        });
        
        // Reset Form
        form.reset();
        resetFileSelection();
        populateSelect(namaKelasSelect, [], "Pilih Tingkat Kelas dulu");
        namaKelasSelect.disabled = true;
      } else {
        Swal.fire("Gagal", res.message || "Terjadi kesalahan saat menyimpan tugas.", "error");
      }
    }

    function onUploadError(err) {
      setLoading(false);
      Swal.fire("Server Error", err.message || "Gagal terhubung dengan server Apps Script.", "error");
    }

    function showWarning(msg) {
      Swal.fire({
        icon: "warning",
        title: "Perhatian",
        text: msg,
        confirmButtonColor: "#4f46e5"
      });
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        submitBtnText.textContent = "Mengunggah Tugas...";
        submitBtn.querySelector("i").className = "fa-solid fa-spinner fa-spin";
      } else {
        submitBtnText.textContent = "Kirim Tugas";
        submitBtn.querySelector("i").className = "fa-solid fa-paper-plane";
      }
    }

    function showStaticMessage(msg, type) {
      const banner = document.getElementById("statusBanner");
      banner.classList.remove("hidden", "bg-red-100", "text-red-700", "bg-yellow-100", "text-yellow-700");
      if (type === "error") {
        banner.classList.add("bg-red-100", "text-red-700");
        banner.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-lg"></i> <span>${msg}</span>`;
      }
    }
  </script>
</body>
</html>
